name: AgentPress CI

on:
  push:
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: AgentPress consistency gate
        run: python3 scripts/agentpress.py consistency-check --json
      - name: AgentPress manifest integrity gate
        run: python3 scripts/verify_manifest_integrity.py
      - name: AgentPress npm pack smoke
        run: |
          npm_config_cache=/tmp/agentpress-npm-cache npm pack --dry-run --json > /tmp/agentpress-pack.json
          node - <<'NODE'
          const fs = require('fs');
          const pack = JSON.parse(fs.readFileSync('/tmp/agentpress-pack.json', 'utf8'))[0];
          if (!pack || !pack.files || !pack.files.some((f) => f.path === 'bin/agentpress.js')) {
            throw new Error('npm pack smoke missing bin/agentpress.js');
          }
          console.log(JSON.stringify({ filename: pack.filename, files: pack.files.length, size: pack.size }, null, 2));
          NODE
      - name: AgentPress Node fast-path gate
        run: |
          PYTHON=/definitely/missing/python3 node bin/agentpress.js doctor --json | python3 -m json.tool >/dev/null
          python3 scripts/agentpress.py no-python-fallback-check . --no-write --json --strict
          python3 -m pytest tests/test_first_user_p0_paths.py tests/test_llms_init_node_fast_path.py tests/test_node_no_python_fallback.py tests/test_node_shim_shell_metachar.py tests/test_lint_doctor_secret_guard.py -q
      - name: AgentPress feedback gate
        run: python3 scripts/agentpress.py feedback-submit --example | python3 -m json.tool >/dev/null
      - name: AgentPress negative fixture gate
        run: python3 scripts/agentpress.py negative-fixtures --json
      - name: AgentPress docs command drift gate
        run: python3 scripts/agentpress.py docs-command-check --json
      - name: AgentPress release promotion fail-closed gate
        run: |
          set +e
          python3 scripts/agentpress.py release-promote-checklist --no-network --no-write --json --strict > /tmp/release-promote-checklist.json
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "release promotion gate unexpectedly passed without independent proof/RFLO approval"; cat /tmp/release-promote-checklist.json; exit 1; fi
          python3 - <<'PY'
          import json
          payload=json.load(open('/tmp/release-promote-checklist.json'))
          assert payload['status'] == 'blocked', payload
          assert payload['promotion_allowed'] is False, payload
          blockers=set(payload.get('blocking_checks') or [])
          assert {'independent_external_proof','rflo_review'} <= blockers, payload
          PY
          python3 -m pytest tests/test_release_promote_checklist.py -q
      - name: AgentPress tool output sample drift gate
        run: python3 scripts/agentpress.py tool-output-sample-generate --manifest agentpress/tools/agentpress-tools.json --check --json
      - name: AgentPress native adapter gate
        run: |
          python3 scripts/agentpress.py native-adapter-check --json
          TMP=/tmp/agentpress-ci-native-nowrite
          rm -rf "$TMP"
          python3 scripts/agentpress.py native-adapter-kit --out "$TMP" --no-write --json
          test ! -e "$TMP"
          if python3 scripts/agentpress.py native-adapter-kit --target nonexistent --no-write --json; then echo "bad native adapter target unexpectedly passed"; exit 1; fi
      - name: AgentPress adversarial edge-case gap scan
        run: python3 scripts/agentpress.py edge-case-gap-scan --json
      - name: AgentPress public schema crawler gate
        run: python3 scripts/agentpress.py schema-validate-all --json
      - name: AgentPress fail-closed trust gate
        run: |
          python3 scripts/agentpress.py trust-tier-evaluate --json
          if python3 scripts/agentpress.py trust-tier-evaluate --scoped-report tests/fixtures/trust/bad-global-proof.json --json; then echo "bad global proof trust fixture unexpectedly passed"; exit 1; fi
          if python3 scripts/agentpress.py trust-tier-evaluate --scoped-report tests/fixtures/trust/bad-missing-receipts.json --json; then echo "bad missing receipts trust fixture unexpectedly passed"; exit 1; fi
      - name: AgentPress executable approval/reviewer gate
        run: |
          python3 scripts/agentpress.py approval-gate-eval tests/fixtures/gates/approval-good.json --json
          if python3 scripts/agentpress.py approval-gate-eval tests/fixtures/gates/approval-bad.json --json; then echo "bad approval fixture unexpectedly passed"; exit 1; fi
          python3 scripts/agentpress.py reviewer-gate-eval tests/fixtures/gates/reviewer-good.json --json
          if python3 scripts/agentpress.py reviewer-gate-eval tests/fixtures/gates/reviewer-bad.json --json; then echo "bad reviewer fixture unexpectedly passed"; exit 1; fi
      - name: AgentPress host transcript and TTF-green gate
        run: |
          python3 scripts/agentpress.py host-transcript-validate tests/fixtures/conformance/host-transcript-good.json --json
          if python3 scripts/agentpress.py host-transcript-validate tests/fixtures/conformance/host-transcript-bad.json --json; then echo "bad host transcript fixture unexpectedly passed"; exit 1; fi
          python3 scripts/agentpress.py ttf-green-import tests/fixtures/metrics/ttf-green-good.json --json
          if python3 scripts/agentpress.py ttf-green-import tests/fixtures/metrics/ttf-green-bad.json --json; then echo "bad TTF-green fixture unexpectedly passed"; exit 1; fi
          python3 scripts/agentpress.py conformance-evidence-score --json
      - name: AgentPress strict schema gate
        run: |
          python3 scripts/agentpress.py schema-validate tests/fixtures/strict-schema/valid-agent-task-card.json --schema agent-task-card.schema.json --json
          if python3 scripts/agentpress.py schema-validate tests/fixtures/strict-schema/invalid-agent-task-card.json --schema agent-task-card.schema.json --json; then echo "invalid strict-schema fixture unexpectedly passed"; exit 1; fi
          python3 scripts/agentpress.py verify agentpress/examples/api-docs-handoff --strict-schema --json
