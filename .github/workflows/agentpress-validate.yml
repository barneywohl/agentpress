name: AgentPress Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate AgentPress assets
        run: python3 scripts/validate_agentpress_assets.py
      - name: Validate AgentPress consistency and feedback contracts
        run: |
          python3 scripts/agentpress.py consistency-check --json
          python3 scripts/agentpress.py feedback-submit --example | python3 -m json.tool >/dev/null
          test -f agentpress/feedback/response-template.json
          test -f agentpress/audit/first-contact-evidence.json
      - name: Validate AgentPress mesh self-registration
        run: |
          cp agentpress/mesh/known-agents.json /tmp/known-agents.json
          python3 scripts/agentpress.py discover --self-register --canonical-url https://barneywohl.github.io/agentpress/ --agent-id agentpress-barneywohl --registry /tmp/known-agents.json --json
          python3 -m json.tool /tmp/known-agents.json >/dev/null
          python3 - <<'PY2'
          import json
          data=json.load(open('/tmp/known-agents.json'))
          assert data.get('agent_count', 0) >= 1, data
          PY2







      - name: Validate AgentPress tool discovery manifest
        run: |
          python3 scripts/agentpress.py tools-manifest
          python3 scripts/agentpress.py tools-manifest-check --json
          python3 -m json.tool agentpress/tools/agentpress-tools.json >/dev/null
      - name: Validate AgentPress offline package
        run: |
          python3 scripts/agentpress.py package . --out /tmp/agentpress-offline.tar.gz
          python3 scripts/agentpress.py package-verify /tmp/agentpress-offline.tar.gz --json
          python3 scripts/agentpress.py package-index /tmp/agentpress-offline.tar.gz --out /tmp/agentpress-offline-index.json
          python3 -m json.tool /tmp/agentpress-offline-index.json >/dev/null
      - name: Validate AgentPress team capability packs
        run: |
          python3 scripts/agentpress.py team-pack --slug ci-research-team --display-name "CI Research Team" --capability research:market-map --capability writing:brief --consent-source public_source --public-sources "https://example.com" --out /tmp/ci-team-pack.json
          python3 scripts/agentpress.py team-pack-validate /tmp/ci-team-pack.json --json
          python3 scripts/agentpress.py team-pack-validate agentpress/team-packs/example-research-team.json --json
      - name: Validate AgentPress self-test runner
        run: |
          python3 scripts/agentpress.py self-test --agent-id ci-agent --out /tmp/agentpress-self-test.jsonl
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/agentpress-self-test.jsonl') if x.strip()]
          assert len(rows) == 5
          assert all(r['status'] == 'pass' for r in rows)
          PY
      - name: Validate AgentPress search index
        run: |
          python3 scripts/agentpress.py index-search --json
          python3 scripts/agentpress.py search "message route capability" --json
          python3 scripts/agentpress.py search "bundle generator api docs" --json
          python3 scripts/agentpress.py search "fail closed invalid" --json
      - name: Validate AgentPress bundle generator
        run: |
          python3 scripts/agentpress.py bundle tests/fixtures/source-docs --out /tmp/generated-agentpress-bundle --title "Example API Docs" --canonical-url "https://example.com/agentpress/example-api/" --force
          python3 scripts/agentpress.py verify /tmp/generated-agentpress-bundle --json
          python3 scripts/agentpress.py score /tmp/generated-agentpress-bundle









      - name: Validate AgentPress install and release index
        run: |
          rm -rf /tmp/ap-release-build /tmp/ap-install-test
          mkdir -p /tmp/ap-release-build
          python3 scripts/agentpress.py package . --out /tmp/ap-release-build/agentpress-offline.tar.gz
          python3 scripts/agentpress.py release-index /tmp/ap-release-build/agentpress-offline.tar.gz --manifest /tmp/ap-release-build/agentpress-offline.tar.gz.sha256.json --base-url file:///tmp/ap-release-build/ --package-url agentpress-offline.tar.gz --manifest-url agentpress-offline.tar.gz.sha256.json --out /tmp/ap-release-build/release-index.json --json
          python3 scripts/agentpress.py install-script --out /tmp/ap-release-build/install.py --base-url file:///tmp/ap-release-build/ --json
          python3 /tmp/ap-release-build/install.py --base-url file:///tmp/ap-release-build/ --release-index release-index.json --out /tmp/ap-install-test --json
          test -f /tmp/ap-install-test/scripts/agentpress.py
          python3 /tmp/ap-install-test/scripts/agentpress.py doctor /tmp/ap-install-test --json
      - name: Validate AgentPress proof submission pack
        run: |
          rm -rf /tmp/ap-submit
          python3 scripts/agentpress.py landing-receipt --agent-id submit-ci-agent --runtime codex --discovery-channel llms.txt --capability validate_agentpress_bundle --out /tmp/submit-ci-agent.json --json
          python3 scripts/agentpress.py submission-pack --receipt /tmp/submit-ci-agent.json --out /tmp/ap-submit --json
          test -f /tmp/ap-submit/github-issue.md
          test -f /tmp/ap-submit/submission-pack.json
          python3 -m json.tool /tmp/ap-submit/submission-pack.json >/dev/null
      - name: Validate AgentPress reputation index
        run: |
          rm -rf /tmp/ap-rep
          mkdir -p /tmp/ap-rep/landing /tmp/ap-rep/self-test /tmp/ap-rep/receipts
          python3 scripts/agentpress.py landing-receipt --agent-id rep-ci-agent --runtime codex --discovery-channel llms.txt --capability validate_agentpress_bundle --out /tmp/ap-rep/landing/rep-ci-agent.json --json
          python3 scripts/agentpress.py self-test --agent-id rep-ci-agent --out /tmp/ap-rep/self-test/rep-ci-agent.jsonl
          python3 scripts/agentpress.py reputation-index --landing-dir /tmp/ap-rep/landing --self-test-dir /tmp/ap-rep/self-test --receipt-dir /tmp/ap-rep/receipts --out /tmp/ap-rep/reputation-index.json --json
          python3 -m json.tool /tmp/ap-rep/reputation-index.json >/dev/null
      - name: Validate AgentPress landing receipts
        run: |
          rm -rf /tmp/ap-landing
          mkdir -p /tmp/ap-landing
          python3 scripts/agentpress.py landing-receipt --agent-id ci-agent --runtime codex --discovery-channel llms.txt --capability validate_agentpress_bundle --capability bundle_diff --out /tmp/ap-landing/ci-agent.json --json
          python3 scripts/agentpress.py landing-index /tmp/ap-landing --out /tmp/ap-landing/agent-landing-index.json --json
          python3 -m json.tool /tmp/ap-landing/ci-agent.json >/dev/null
          python3 -m json.tool /tmp/ap-landing/agent-landing-index.json >/dev/null
      - name: Validate AgentPress inbox compiler
        run: |
          rm -rf /tmp/ap-comms-compile /tmp/ap-inbox-hub
          python3 scripts/agentpress.py message inbox-init --dir /tmp/ap-comms-compile
          python3 scripts/agentpress.py message register --agent-id alpha --capabilities validate_agentpress_bundle,bundle_diff --dir /tmp/ap-comms-compile
          python3 scripts/agentpress.py message create-request --capability bundle_diff --task "Compare v1 and v2 bundle" --requester-id ci --out /tmp/ap_ic_req.json
          python3 scripts/agentpress.py message send --to alpha --request /tmp/ap_ic_req.json --dir /tmp/ap-comms-compile >/tmp/ap_ic_send.json
          MID=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/ap_ic_send.json'))['delivery_id'])
          PY
          )
          python3 scripts/agentpress.py message claim --agent-id alpha --message-id "$MID" --dir /tmp/ap-comms-compile
          python3 scripts/agentpress.py inbox-compile /tmp/ap-comms-compile --out /tmp/ap-inbox-hub --json
          test -f /tmp/ap-inbox-hub/index.html
          test -f /tmp/ap-inbox-hub/inbox-index.json
          test -f /tmp/ap-inbox-hub/inbox-messages.jsonl
      - name: Validate AgentPress bundle diff
        run: |
          rm -rf /tmp/ap-diff-a /tmp/ap-diff-b
          cp -R agentpress/examples/api-docs-handoff /tmp/ap-diff-a
          cp -R agentpress/examples/api-docs-handoff /tmp/ap-diff-b
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/ap-diff-b/agent-task-card.json')
          j=json.loads(p.read_text())
          j['objective']='Changed objective for CI drift test'
          p.write_text(json.dumps(j, indent=2)+'\n')
          PY
          python3 scripts/agentpress.py bundle-diff /tmp/ap-diff-a /tmp/ap-diff-b --json
          python3 scripts/agentpress.py upgrade-check /tmp/ap-diff-a /tmp/ap-diff-b --json
          python3 scripts/agentpress.py bundle-diff /tmp/ap-diff-a /tmp/ap-diff-a --json
      - name: Validate AgentPress adapter quickstarts
        run: |
          rm -rf /tmp/ap-adapters
          python3 scripts/agentpress.py adapter-quickstart --agent-type all --out /tmp/ap-adapters --json
          python3 scripts/agentpress.py adapter-quickstart-check /tmp/ap-adapters --json
          test -f /tmp/ap-adapters/codex/CODEX.md
          test -f /tmp/ap-adapters/claude/CLAUDE.md
          test -f /tmp/ap-adapters/gemini/GEMINI.md
          test -f /tmp/ap-adapters/glm/GLM.md
          test -f /tmp/ap-adapters/browser/BROWSER_AGENT.md
      - name: Validate AgentPress handoff receipts
        run: |
          python3 scripts/agentpress.py message create-request --capability validate_agentpress_bundle --task "Verify this bundle and report missing contracts" --requester-id ci-agent-a --out /tmp/ap-handoff-request.json
          python3 scripts/agentpress.py handoff-create --from-agent ci-agent-a --to-agent ci-agent-b --capability validate_agentpress_bundle --context /tmp/ap-handoff-request.json --instructions "Continue validation and produce receipt" --out /tmp/ap-handoff.json
          python3 scripts/agentpress.py handoff-validate /tmp/ap-handoff.json --json
          python3 scripts/agentpress.py message create-response --request /tmp/ap-handoff-request.json --responder-id ci-agent-b --status completed --result-inline '{"status":"ok"}' --out /tmp/ap-handoff-response.json
          python3 scripts/agentpress.py receipt-create --handoff /tmp/ap-handoff.json --agent-id ci-agent-b --status completed --response /tmp/ap-handoff-response.json --out /tmp/ap-receipt.json
          python3 scripts/agentpress.py receipt-validate /tmp/ap-receipt.json --json
      - name: Validate AgentPress static inbox communication
        run: |
          rm -rf /tmp/ap-comms
          python3 scripts/agentpress.py message inbox-init --dir /tmp/ap-comms
          python3 scripts/agentpress.py message register --agent-id agent-alpha --capabilities validate_agentpress_bundle,bundle_generator --dir /tmp/ap-comms
          python3 scripts/agentpress.py message create-request --capability validate_agentpress_bundle --task "Verify this bundle and report missing contracts" --requester-id ci-agent --out /tmp/ap-inbox-request.json
          python3 scripts/agentpress.py message send --to agent-alpha --request /tmp/ap-inbox-request.json --dir /tmp/ap-comms > /tmp/ap-send.json
          MSG=$(python3 -c 'import json; print(json.load(open("/tmp/ap-send.json"))["delivery_id"])')
          python3 scripts/agentpress.py message inbox-check --agent-id agent-alpha --dir /tmp/ap-comms --json
          python3 scripts/agentpress.py message claim --message-id "$MSG" --agent-id agent-alpha --dir /tmp/ap-comms
          python3 scripts/agentpress.py message create-response --request /tmp/ap-inbox-request.json --responder-id agent-alpha --status completed --result-inline '{"status":"ok"}' --out /tmp/ap-inbox-response.json
          python3 scripts/agentpress.py message complete --message-id "$MSG" --agent-id agent-alpha --response /tmp/ap-inbox-response.json --dir /tmp/ap-comms
          python3 scripts/agentpress.py message inbox-check --agent-id agent-alpha --dir /tmp/ap-comms --json
      - name: Validate AgentPress message CLI
        run: |
          python3 scripts/agentpress.py message create-request --capability validate_agentpress_bundle --task "Verify this bundle and report missing contracts" --requester-id ci-agent --out /tmp/ap-request.json
          python3 scripts/agentpress.py message route --capability validate_agentpress_bundle --json
          python3 scripts/agentpress.py message create-response --request /tmp/ap-request.json --responder-id agentpress-reference-agent --status completed --result-inline '{"status":"ok"}' --out /tmp/ap-response.json
          python3 scripts/agentpress.py message thread-create --request /tmp/ap-request.json --out /tmp/ap-thread.json
          python3 scripts/agentpress.py message thread-append --thread /tmp/ap-thread.json --message /tmp/ap-response.json --out /tmp/ap-thread.json
          python3 scripts/agentpress.py message validate /tmp/ap-thread.json --json
          if python3 scripts/agentpress.py message validate tests/fixtures/messages/invalid-request-missing-field.json --json; then echo "invalid request unexpectedly passed"; exit 1; fi
      - name: Parse JSON and XML assets
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
          for p in pathlib.Path('.').rglob('*.xml'):
              ET.parse(p)
          print('json/xml ok')
          PY
      - name: Build smoke test
        run: |
          rm -rf /tmp/agentpress-api-docs
          python3 scripts/agentpress.py build agentpress/examples/api-docs-handoff --out /tmp/agentpress-api-docs
          test -f /tmp/agentpress-api-docs/index.html
      - name: Package build and install smoke test
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
          python3 -m pip install dist/*.whl
          agentpress --help
          rm -rf /tmp/agentpress-package-smoke /tmp/agentpress-package-smoke-public
          agentpress init /tmp/agentpress-package-smoke --title "Package Smoke" --canonical "https://example.com/package-smoke/"
          agentpress audit /tmp/agentpress-package-smoke
          agentpress score /tmp/agentpress-package-smoke
          agentpress build /tmp/agentpress-package-smoke --out /tmp/agentpress-package-smoke-public
          test -f /tmp/agentpress-package-smoke-public/index.html
      - name: AgentPress machine contract CLI gates
        run: |
          python3 scripts/agentpress.py doctor --json
          python3 scripts/agentpress.py schema --json
          python3 scripts/agentpress.py verify agentpress/examples/api-docs-handoff --json
          python3 scripts/agentpress.py negative-fixtures --json
          rm -rf /tmp/agentpress-fetch-ci
          python3 scripts/agentpress.py fetch --base file://$PWD --out /tmp/agentpress-fetch-ci --json > /tmp/agentpress-fetch-ci.json
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/agentpress-fetch-ci.json').read_text())
          assert data['status'] == 'ok', data
          assert data['count'] >= 9, data
          for row in data['assets']:
              assert row.get('sha256') and len(row['sha256']) == 64, row
              assert pathlib.Path(row['local_path']).exists(), row
          print(f"fetch gate ok: {data['count']} assets")
          PY
      - name: Local availability gate
        run: python3 scripts/check_agentpress_availability.py --root .
      - name: Cross-agent eval prompt parse gate
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('agentpress/evals/cross_agent_compatibility_prompts.jsonl')
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert rows, 'no cross-agent compatibility prompts'
          families = {r['agent_family'] for r in rows}
          required = {'codex', 'claude', 'gemini', 'glm', 'open_source_instruct'}
          missing = required - families
          assert not missing, f'missing agent families: {missing}'
          print(f'cross-agent prompts ok: {len(rows)} rows')
          PY
