[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpress-core"
version = "1.0.0rc2"
description = "Zero-dependency parser for agents.txt v1.0. The reference Python implementation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Barney Wohl"}]
keywords = ["agents.txt", "agentpress", "ai-agents", "parser", "validator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries"
]

[project.urls]
Homepage = "https://github.com/barneywohl/agentpress/tree/main/python-core"
Repository = "https://github.com/barneywohl/agentpress"
Issues = "https://github.com/barneywohl/agentpress/issues"

[tool.setuptools]
packages = ["agentpress_core"]
