[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpress-static"
version = "1.0.0"
description = "agents.txt for any repo. Tell autonomous AI agents what they're allowed to do, in 60 seconds."
readme = "agentpress/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Barney Wohl"}]
keywords = ["agents.txt", "agent-press", "agentpress", "ai-agents", "autonomous-agents", "claude-code", "cursor", "devin", "llms", "llms-txt", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing :: Markup",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "agentpress-core>=1.0.0rc1"
]

[project.urls]
Homepage = "https://github.com/barneywohl/agentpress"
Repository = "https://github.com/barneywohl/agentpress"
Issues = "https://github.com/barneywohl/agentpress/issues"

[project.scripts]
agentpress = "agentpress_cli.cli:main"

[tool.setuptools]
packages = ["agentpress", "agentpress_cli", "scripts"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.jsonl", "*.txt", "*.cff", "*.tmpl", "*.xml"]
