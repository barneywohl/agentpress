[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpress-static"
version = "0.2.0rc7"
description = "Agent-native static instruction surfaces, validators, and CLI tools."
readme = "agentpress/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Barney Wohl"}]
keywords = ["agents", "llms", "publishing", "rag", "evals", "static-site"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
  "Topic :: Internet :: WWW/HTTP :: Site Management"
]

[project.scripts]
agentpress = "agentpress_cli.cli:main"

[tool.setuptools]
packages = ["agentpress", "agentpress_cli", "scripts"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.jsonl", "*.txt", "*.cff", "*.tmpl", "*.xml"]
"agentpress" = ["public-material-kits/*", "material-kits/*/*"]
